<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dumb Together — Пати-игра в браузере</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full space-y-6 text-center">
    <!-- Header / Logo -->
    <div class="space-y-2">
      <div class="inline-flex items-center justify-center p-3 bg-indigo-600/20 rounded-2xl border border-indigo-500/30 text-4xl mb-2">
        🎭🎙️💥
      </div>
      <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-pink-400 to-amber-400 bg-clip-text text-transparent">
        DUMB TOGETHER
      </h1>
      <p class="text-slate-400 text-sm">
        Кооперативная озвучка безумных клипов с друзьями прямо в браузере
      </p>
    </div>

    <!-- Main Card -->
    <div class="glass-card p-6 space-y-5 text-left neon-glow-indigo">
      
      <!-- Option A: Join as Player -->
      <div class="space-y-4">
        <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
          <span>📱</span> Присоединиться к комнате
        </h2>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Код комнаты (4 буквы)</label>
          <input id="roomCodeInput" type="text" maxlength="4" placeholder="WOLF"
            class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-center text-2xl font-mono uppercase tracking-widest text-indigo-300 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Ваш никнейм</label>
          <input id="nicknameInput" type="text" maxlength="15" placeholder="Голосистый Боб"
            class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-2">Выберите аватар</label>
          <div id="avatarPicker" class="grid grid-cols-6 gap-2">
            <!-- Avatars populated via JS -->
          </div>
        </div>

        <button id="joinBtn"
          class="w-full py-4 bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
          <span>Войти в игру</span> 🚀
        </button>
      </div>

      <div class="relative flex items-center py-2">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="flex-shrink mx-4 text-xs text-slate-500 uppercase font-semibold">или</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>

      <!-- Option B: Create Room as Host -->
      <button id="createHostBtn"
        class="w-full py-3.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-600 text-slate-200 font-semibold rounded-xl transition flex items-center justify-center gap-2">
        <span>📺</span> Создать экран (Режим ТВ / ПК)
      </button>
    </div>

    <!-- Quick instructions -->
    <div class="text-xs text-slate-500 space-y-1">
      <p>💡 <b>Как играть:</b> Откройте экран Хоста на ТВ/ноутбуке, а друзья подключаются с телефонов по QR-коду.</p>
      <p>Работает на iOS Safari, Android Chrome и ПК без установки приложений.</p>
    </div>
  </div>

  <script>
    const AVATARS = ['🦊', '🐶', '🐱', '🐼', '🐸', '🦁', '🤖', '👽', '🥷', '🧙', '🍕', '🌮'];
    let selectedAvatar = AVATARS[0];

    const avatarPicker = document.getElementById('avatarPicker');
    AVATARS.forEach((av) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `p-2 text-2xl rounded-lg border transition ${av === selectedAvatar ? 'border-indigo-500 bg-indigo-500/20' : 'border-slate-800 bg-slate-900/50 hover:border-slate-700'}`;
      btn.textContent = av;
      btn.onclick = () => {
        selectedAvatar = av;
        Array.from(avatarPicker.children).forEach(b => {
          b.className = 'p-2 text-2xl rounded-lg border border-slate-800 bg-slate-900/50 hover:border-slate-700';
        });
        btn.className = 'p-2 text-2xl rounded-lg border border-indigo-500 bg-indigo-500/20';
      };
      avatarPicker.appendChild(btn);
    });

    // Check query params (e.g. ?room=ABCD)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('room')) {
      document.getElementById('roomCodeInput').value = urlParams.get('room').toUpperCase();
    }

    document.getElementById('joinBtn').onclick = () => {
      const room = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      const nick = document.getElementById('nicknameInput').value.trim() || 'Голосистый';
      if (!room || room.length < 3) {
        alert('Пожалуйста, введите код комнаты');
        return;
      }
      window.location.href = `/static/controller.html?room=${encodeURIComponent(room)}&nick=${encodeURIComponent(nick)}&avatar=${encodeURIComponent(selectedAvatar)}`;
    };

    document.getElementById('createHostBtn').onclick = async () => {
      try {
        const res = await fetch('/api/rooms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hostNickname: 'Главный Экран', avatarId: '📺' })
        });
        const data = await res.json();
        window.location.href = `/static/host.html?room=${data.roomCode}`;
      } catch (err) {
        alert('Ошибка создания комнаты: ' + err.message);
      }
    };
  </script>
</body>
</html>
