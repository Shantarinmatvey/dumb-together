<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dumb Together — Пати-игра в браузере</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="flex flex-col items-center justify-center p-4 min-h-screen">

  <div class="max-w-md w-full space-y-6 text-center">
    <!-- Header / Logo -->
    <div class="space-y-2">
      <div class="inline-flex items-center justify-center p-3 bg-indigo-600/20 rounded-2xl border border-indigo-500/30 text-4xl mb-2">
        🎭🎙️💥
      </div>
      <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-pink-400 to-amber-400 bg-clip-text text-transparent">
        DUMB TOGETHER
      </h1>
      <p class="text-slate-400 text-sm">
        Командная озвучка коротких роликов по фрагментам с друзьями прямо в браузере!
      </p>
    </div>

    <!-- Main Card -->
    <div class="glass-card p-6 space-y-5 text-left neon-glow-indigo">
      
      <!-- Player Profile Form -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Ваш никнейм</label>
          <input id="nicknameInput" type="text" maxlength="15" placeholder="Голосистый Боб"
            class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-200 focus:outline-none focus:border-indigo-500 font-bold">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-2">Выберите аватар</label>
          <div id="avatarPicker" class="grid grid-cols-6 gap-2">
            <!-- Avatars populated via JS -->
          </div>
        </div>
      </div>

      <div class="border-t border-slate-800 pt-4 space-y-4">
        <!-- Option A: Join Existing Room -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Код комнаты для входа (4 буквы)</label>
          <div class="flex gap-2">
            <input id="roomCodeInput" type="text" maxlength="4" placeholder="WOLF"
              class="flex-1 px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-center text-xl font-mono uppercase tracking-widest text-indigo-300 focus:outline-none focus:border-indigo-500">
            <button id="joinBtn"
              class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95 text-sm">
              Войти 🚀
            </button>
          </div>
        </div>

        <div class="relative flex items-center py-1">
          <div class="flex-grow border-t border-slate-800"></div>
          <span class="flex-shrink mx-3 text-[11px] text-slate-500 uppercase font-semibold">или станьте хостом</span>
          <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <!-- Option B: Create Room as 1st Player (Host) -->
        <button id="createHostBtn"
          class="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold rounded-xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2">
          <span>👑 СОЗДАТЬ НОВУЮ КОМНАТУ</span>
        </button>
      </div>
    </div>

    <!-- Quick instructions -->
    <div class="text-xs text-slate-500 space-y-1">
      <p>💡 <b>Как играть:</b> Создайте комнату, отправьте код друзьям. Каждый участник получит свой случайный фрагмент для озвучки, а в конце — 30 секунд на голосование за лучший голос!</p>
    </div>
  </div>

  <script>
    const AVATARS = ['🦊', '🐶', '🐱', '🐼', '🐸', '🦁', '🤖', '👽', '🥷', '🧙', '🍕', '🌮'];
    let selectedAvatar = AVATARS[0];

    const avatarPicker = document.getElementById('avatarPicker');
    AVATARS.forEach((av) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `p-2 text-2xl rounded-lg border transition ${av === selectedAvatar ? 'border-indigo-500 bg-indigo-500/20' : 'border-slate-800 bg-slate-900/50 hover:border-slate-700'}`;
      btn.textContent = av;
      btn.onclick = () => {
        selectedAvatar = av;
        Array.from(avatarPicker.children).forEach(b => {
          b.className = 'p-2 text-2xl rounded-lg border border-slate-800 bg-slate-900/50 hover:border-slate-700';
        });
        btn.className = 'p-2 text-2xl rounded-lg border border-indigo-500 bg-indigo-500/20';
      };
      avatarPicker.appendChild(btn);
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('room')) {
      document.getElementById('roomCodeInput').value = urlParams.get('room').toUpperCase();
    }

    function generateCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let res = '';
      for (let i = 0; i < 4; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
      return res;
    }

    function getNickname() {
      return document.getElementById('nicknameInput').value.trim() || 'Голосистый ' + Math.floor(Math.random() * 90 + 10);
    }

    // Join room button
    document.getElementById('joinBtn').onclick = () => {
      const room = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      const nick = getNickname();
      if (!room || room.length < 3) {
        alert('Пожалуйста, укажите код комнаты');
        return;
      }
      window.location.href = `./game.html?room=${encodeURIComponent(room)}&nick=${encodeURIComponent(nick)}&avatar=${encodeURIComponent(selectedAvatar)}&isHost=false`;
    };

    // Create room button
    document.getElementById('createHostBtn').onclick = () => {
      const code = generateCode();
      const nick = getNickname();
      window.location.href = `./game.html?room=${code}&nick=${encodeURIComponent(nick)}&avatar=${encodeURIComponent(selectedAvatar)}&isHost=true`;
    };
  </script>
</body>
</html>
